  const d=new Date(year,month-1+delta,1);
  return {year:d.getFullYear(),month:d.getMonth()+1};
}

// ─── SVG CHART HELPERS ────────────────────────────────────────────────────────

/** 正負両方向の差異バーチャート */
function GapBarChart({data, labelKey="label", valueKey="gap", height=200}) {
  const W=700, H=height, padL=58, padR=16, padT=20, padB=52;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const vals=data.map(d=>d[valueKey]||0);
  const maxAbs=Math.max(...vals.map(v=>Math.abs(v)),1);
  const [tip,setTip]=useState(null);

  const zero=padT+innerH/2; // ゼロライン位置
  const barW=Math.max(4,innerW/data.length*0.65);
  const halfH=innerH/2;

  function barY(v){return v>=0?zero-((v/maxAbs)*halfH):zero;}
  function barH(v){return (Math.abs(v)/maxAbs)*halfH;}

  const ticks=[-maxAbs,-maxAbs/2,0,maxAbs/2,maxAbs];
  return (
    <div className="relative" style={{width:'100%',aspectRatio:`${W}/${H}`}}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
        {/* grid */}
        {ticks.map((t,i)=>{
          const y=padT+innerH/2-(t/maxAbs)*halfH;
          return(
            <g key={i}>
              <line x1={padL} y1={y} x2={W-padR} y2={y} stroke={t===0?"#475569":"#1e293b"} strokeWidth={t===0?1.5:1} strokeDasharray={t===0?"0":"3 3"}/>
              <text x={padL-6} y={y+4} textAnchor="end" fill="#64748b" fontSize={10}>{Math.round(t)}万</text>
            </g>
          );
        })}
        {/* bars */}
        {data.map((d,i)=>{
          const v=d[valueKey]||0;
          const x=padL+(i/data.length)*innerW+(innerW/data.length-barW)/2;
          return(
            <rect key={i} x={x} y={barY(v)} width={barW} height={Math.max(2,barH(v))}
              fill={v>=0?"#10b981":"#ef4444"} rx={3}
              onMouseEnter={e=>setTip({x:e.clientX,y:e.clientY,d,i})}
              onMouseLeave={()=>setTip(null)}
              className="cursor-pointer"/>
          );
        })}
        {/* x labels */}
        {data.map((d,i)=>(i%Math.ceil(data.length/12)===0&&(
          <text key={i} x={padL+(i+0.5)/data.length*innerW} y={H-padB+16}
            textAnchor="middle" fill="#64748b" fontSize={9}
            transform={`rotate(-45,${padL+(i+0.5)/data.length*innerW},${H-padB+16})`}>
            {d[labelKey]}
          </text>
        )))}
        <line x1={padL} y1={zero} x2={W-padR} y2={zero} stroke="#64748b" strokeWidth={1}/>
      </svg>
      {tip&&(
        <div className="fixed z-50 bg-slate-800 border border-slate-700 rounded-none px-3 py-2 text-xs shadow-xl pointer-events-none"
          style={{left:tip.x+12,top:tip.y-50}}>
          <div className="text-slate-300 font-semibold mb-1">{tip.d[labelKey]}</div>
          <div className="flex flex-col gap-0.5">
            <span className="text-slate-400">計画: <span className="text-white font-bold">{Math.round(tip.d.plan||0).toLocaleString()}万円</span></span>
            <span className="text-slate-400">予測: <span className="text-white font-bold">{Math.round(tip.d.forecast||0).toLocaleString()}万円</span></span>
            <span className={`font-bold ${(tip.d[valueKey]||0)>=0?"text-emerald-400":"text-red-400"}`}>
              差異: {(tip.d[valueKey]||0)>=0?"+":" "}{Math.round(tip.d[valueKey]||0).toLocaleString()}万円
            </span>
          </div>
        </div>
      )}
    </div>
  );
}

/** 通常の積み上げ/並列棒グラフ */
function BarChartSVG({data,keys,colors,labels,height=260,formatter=(v)=>`${v}万`}) {
  const W=700,H=height,padL=58,padR=16,padT=16,padB=52;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const maxVal=Math.max(...data.flatMap(d=>keys.map(k=>d[k]||0)),1);
  const barW=Math.max(4,(innerW/data.length)*0.7/keys.length);
  const groupW=innerW/data.length;
  const [tip,setTip]=useState(null);
  const yTicks=5;
  return(
    <div className="relative" style={{width:'100%',aspectRatio:`${W}/${H}`}}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
        {Array.from({length:yTicks+1},(_,i)=>{
          const y=padT+innerH-(i/yTicks)*innerH;
          return(<g key={i}>
            <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="#1e293b" strokeWidth={1}/>
            <text x={padL-6} y={y+4} textAnchor="end" fill="#64748b" fontSize={10}>{formatter(Math.round((i/yTicks)*maxVal))}</text>
          </g>);
        })}
        {data.map((d,di)=>{
          const gx=padL+di*groupW+groupW*0.15;
          return keys.map((k,ki)=>{
            const val=d[k]||0;
            const bh=(val/maxVal)*innerH;
            const x=gx+ki*(barW+2);
            const y=padT+innerH-bh;
            return(<rect key={k} x={x} y={y} width={barW} height={bh} fill={colors[ki]}
              rx={3} opacity={0.9}
              onMouseEnter={e=>setTip({x:e.clientX,y:e.clientY,d,di})}
              onMouseLeave={()=>setTip(null)}
              className="cursor-pointer"/>);
          });
        })}
        {data.map((d,di)=>(di%Math.ceil(data.length/12)===0&&(
          <text key={di} x={padL+di*groupW+groupW/2} y={H-padB+16}
            textAnchor="middle" fill="#64748b" fontSize={9}
            transform={`rotate(-45,${padL+di*groupW+groupW/2},${H-padB+16})`}>
            {d.label}
          </text>
        )))}
        {keys.map((k,ki)=>(
          <g key={k} transform={`translate(${padL+ki*140},${H-8})`}>
            <rect x={0} y={-8} width={10} height={10} fill={colors[ki]} rx={2}/>
            <text x={14} y={0} fill="#94a3b8" fontSize={11}>{labels[ki]}</text>
          </g>
        ))}
      </svg>
      {tip&&(
        <div className="fixed z-50 bg-slate-800 border border-slate-700 rounded-none px-3 py-2 text-xs shadow-xl pointer-events-none"
          style={{left:tip.x+12,top:tip.y-40}}>
          <div className="text-slate-300 font-semibold mb-1">{data[tip.di].label}</div>
          {keys.map((k,ki)=>(
            <div key={k} className="flex items-center gap-2">
              <div className="w-2 h-2 rounded-full" style={{background:colors[ki]}}/>
              <span className="text-slate-400">{labels[ki]}:</span>
              <span className="text-white font-bold">{formatter(data[tip.di][k]||0)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/** 折れ線グラフ */
function LineChartSVG({data,keys,colors,labels,height=240,formatter=(v)=>`${v}万`}) {
  const W=700,H=height,padL=68,padR=16,padT=16,padB=52;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const maxVal=Math.max(...data.flatMap(d=>keys.map(k=>d[k]||0)),1);
  const [tip,setTip]=useState(null);
  const n=data.length;
  function px(i){return padL+(i/(n-1))*innerW;}
  function py(v){return padT+innerH-(v/maxVal)*innerH;}
  const yTicks=5;
  const gw=innerW/n;
  return(
    <div className="relative" style={{width:'100%',aspectRatio:`${W}/${H}`}}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
        {Array.from({length:yTicks+1},(_,i)=>{
          const y=padT+innerH-(i/yTicks)*innerH;
          return(<g key={i}>
            <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="#1e293b" strokeWidth={1}/>
            <text x={padL-6} y={y+4} textAnchor="end" fill="#64748b" fontSize={10}>{formatter(Math.round((i/yTicks)*maxVal))}</text>
          </g>);
        })}
        {keys.map((k,ki)=>(
          <polygon key={`area-${k}`}
            points={`${px(0)},${padT+innerH} ${data.map((_,i)=>`${px(i)},${py(data[i][k]||0)}`).join(' ')} ${px(n-1)},${padT+innerH}`}
            fill={colors[ki]} opacity={0.06}/>
        ))}
        {keys.map((k,ki)=>(
          <polyline key={k}
            points={data.map((_,i)=>`${px(i)},${py(data[i][k]||0)}`).join(' ')}
            fill="none" stroke={colors[ki]} strokeWidth={2.5} strokeLinejoin="round"
            strokeDasharray={ki>0?"8 4":"0"}/>
        ))}
        {data.map((_,i)=>(
          <rect key={i} x={px(i)-gw/2} y={padT} width={gw} height={innerH} fill="transparent"
            onMouseEnter={e=>setTip({x:e.clientX,y:e.clientY,i})}
            onMouseLeave={()=>setTip(null)}/>
        ))}
        {data.map((d,i)=>(i%Math.ceil(n/10)===0&&(
          <text key={i} x={px(i)} y={H-padB+16} textAnchor="middle" fill="#64748b" fontSize={9}
            transform={`rotate(-45,${px(i)},${H-padB+16})`}>{d.label}</text>
        )))}
        {keys.map((k,ki)=>(
          <g key={k} transform={`translate(${padL+ki*180},${H-8})`}>
            <line x1={0} y1={-4} x2={14} y2={-4} stroke={colors[ki]} strokeWidth={2.5} strokeDasharray={ki>0?"6 3":"0"}/>
            <text x={18} y={0} fill="#94a3b8" fontSize={11}>{labels[ki]}</text>
          </g>
        ))}
      </svg>
      {tip&&(()=>{
        const d=data[tip.i];
        return(
          <div className="fixed z-50 bg-slate-800 border border-slate-700 rounded-none px-3 py-2 text-xs shadow-xl pointer-events-none"
            style={{left:tip.x+12,top:tip.y-40}}>
            <div className="text-slate-300 font-semibold mb-1">{d.label}</div>
            {keys.map((k,ki)=>(
              <div key={k} className="flex items-center gap-2">
                <div className="w-2 h-2 rounded-full" style={{background:colors[ki]}}/>
                <span className="text-slate-400">{labels[ki]}:</span>
                <span className="text-white font-bold">{formatter(d[k]||0)}</span>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

// ─── 月別差異テーブル ────────────────────────────────────────────────────────
function GapTable({data,planKey,fcstKey,gapKey,labelKey="label",unit="万円",sign="cost"}) {
  // sign="cost": 差異がマイナス = コスト未発生（後月にシフト）, sign="revenue": 差異がマイナス = 機会損失（警告）
  const rows=data.filter(d=>(d[planKey]||0)!==0||(d[fcstKey]||0)!==0);
  if(rows.length===0) return null;
  return(
    <div className="overflow-x-auto">
      <table className="w-full text-xs border-collapse">
        <thead>
          <tr className="border-b border-slate-700">
            <th className="text-left py-2 px-3 text-slate-400 font-semibold">月</th>
            <th className="text-right py-2 px-3 text-slate-400 font-semibold">計画</th>
            <th className="text-right py-2 px-3 text-slate-400 font-semibold">予測</th>
            <th className="text-right py-2 px-3 text-slate-400 font-semibold">差異</th>
            <th className="py-2 px-3 text-slate-400 font-semibold">インパクト</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((d,i)=>{
            const plan=Math.round(d[planKey]||0);
            const fcst=Math.round(d[fcstKey]||0);
            const gap=Math.round(d[gapKey]||0);
            const isNeg=gap<0;
            const isPos=gap>0;
            // cost: 差異がマイナス = コスト先送り(グレー), 差異がプラス = 追加コスト(赤)
            // revenue: 差異がマイナス = 機会損失(赤), 差異がプラス = 早期売上(緑)
            let badgeColor, badgeText;
            if(gap===0){badgeColor="text-slate-500";badgeText="";}
            else if(sign==="cost"){
              if(isNeg){badgeColor="text-slate-400";badgeText="計画コスト";}
              else{badgeColor="text-red-400";badgeText="予測コスト";}
            }else{
              if(isNeg){badgeColor="text-red-400";badgeText="機会損失";}
              else{badgeColor="text-emerald-400";badgeText="早期売上";}
            }
            return(
              <tr key={i} className={`border-b border-slate-800/50 hover:bg-slate-800/30 transition-colors ${gap!==0?"":""}`}>
                <td className="py-2 px-3 text-slate-300 font-medium">{d[labelKey]}</td>
                <td className="py-2 px-3 text-right text-slate-300">{plan>0?`${plan.toLocaleString()}${unit}`:"—"}</td>
                <td className="py-2 px-3 text-right text-slate-300">{fcst>0?`${fcst.toLocaleString()}${unit}`:"—"}</td>
                <td className={`py-2 px-3 text-right font-bold ${gap<0?"text-red-400":gap>0?"text-emerald-400":"text-slate-500"}`}>
                  {gap!==0?(gap>0?"+":"")+gap.toLocaleString()+unit:"±0"}
                </td>
                <td className="py-2 px-3">
                  {gap!==0&&(
                    <span className={`inline-flex items-center gap-1 text-[10px] font-semibold ${badgeColor}`}>
                      {isNeg?"▼":"▲"} {badgeText}
                    </span>
                  )}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ─── DATE HELPERS ─────────────────────────────────────────────────────────────
function offsetToYM(baseYear, baseMonth, offset) {
  const d = new Date(baseYear, baseMonth - 1 + offset, 1);
  return { year: d.getFullYear(), month: d.getMonth() + 1 };
}
function ymToOffset(baseYear, baseMonth, year, month) {
  return (year - baseYear) * 12 + (month - baseMonth);
}

// ─── TASK FORM ────────────────────────────────────────────────────────────────
function YMPicker({label, year, month, onChange, accent=false}) {
  const years = [];
  for(let y = 2024; y <= 2032; y++) years.push(y);
  return (
    <div>
      <label className={`text-xs mb-1 block ${accent?"text-amber-400":"text-slate-400"}`}>{label}</label>
      <div className="flex gap-1">
        <select value={year} onChange={e=>onChange(Number(e.target.value), month)}
          className={`flex-1 bg-slate-700 border ${accent?"border-amber-600/50":"border-slate-600"} px-1 py-1.5 text-xs text-white focus:outline-none`}>
          {years.map(y=><option key={y} value={y}>{y}年</option>)}
        </select>
        <select value={month} onChange={e=>onChange(year, Number(e.target.value))}
          className={`flex-1 bg-slate-700 border ${accent?"border-amber-600/50":"border-slate-600"} px-1 py-1.5 text-xs text-white focus:outline-none`}>
          {MONTH_JP.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
        </select>
      </div>
    </div>
  );
}

function TaskForm({task, baselineLaunchYear, baselineLaunchMonth, delayMonths, onSave, onCancel}) {
  const [f,setF]=useState({
    name:task.name,
    startOffset:task.startOffset, endOffset:task.endOffset,
    cost:task.cost, costType:task.costType||"lump",
    fcstStartOffset:task.fcstStartOffset,
    fcstEndOffset:task.fcstEndOffset,
  });
  const isCustom = f.fcstStartOffset!==null || f.fcstEndOffset!==null;
  const s=(k,v)=>setF(p=>({...p,[k]:v}));

  const startYM = offsetToYM(baselineLaunchYear, baselineLaunchMonth, f.startOffset);
  const endYM   = offsetToYM(baselineLaunchYear, baselineLaunchMonth, f.endOffset);
  const fcstStartOff = isCustom ? f.fcstStartOffset : f.startOffset + delayMonths;
  const fcstEndOff   = isCustom ? f.fcstEndOffset   : f.endOffset   + delayMonths;
  const fcstStartYM  = offsetToYM(baselineLaunchYear, baselineLaunchMonth, fcstStartOff);
  const fcstEndYM    = offsetToYM(baselineLaunchYear, baselineLaunchMonth, fcstEndOff);

  function toggleCustom(checked) {
    if(checked){
      setF(p=>({...p, fcstStartOffset: p.startOffset+delayMonths, fcstEndOffset: p.endOffset+delayMonths}));
    } else {
      setF(p=>({...p, fcstStartOffset:null, fcstEndOffset:null}));
    }
  }

  return(
    <div className="mb-4 bg-slate-800/80 border border-indigo-700/50 p-4 slide-in">
      <p className="text-xs font-semibold text-indigo-300 mb-3">{task.id==="new"?"新しいタスク":"タスクを編集"}</p>
      <div className="space-y-2.5">
        <input value={f.name} onChange={e=>s('name',e.target.value)} placeholder="タスク名"
          className="w-full bg-slate-700 border border-slate-600 px-3 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500"/>

        <div className="text-xs text-slate-400 font-semibold pt-1">📋 計画期間</div>
        <div className="grid grid-cols-2 gap-2">
          <YMPicker label="開始" year={startYM.year} month={startYM.month}
            onChange={(y,m)=>s('startOffset', ymToOffset(baselineLaunchYear,baselineLaunchMonth,y,m))}/>
          <YMPicker label="終了" year={endYM.year} month={endYM.month}
            onChange={(y,m)=>s('endOffset', ymToOffset(baselineLaunchYear,baselineLaunchMonth,y,m))}/>
        </div>

        <div>
          <label className="text-xs text-slate-400 mb-1 block">コスト（万円・終了月に一括計上）</label>
          <input type="number" value={f.cost} onChange={e=>s('cost',Number(e.target.value))}
            className="w-full bg-slate-700 border border-slate-600 px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"/>
        </div>

        <div className="border-t border-slate-700 pt-3">
          <label className="flex items-center gap-2 cursor-pointer mb-2">
            <div className={`w-9 h-5 rounded-full relative transition-colors ${isCustom?"bg-amber-500":"bg-slate-600"}`}
              onClick={()=>toggleCustom(!isCustom)}>
              <div className={`absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform ${isCustom?"translate-x-4":""}`}/>
            </div>
            <span className="text-xs text-slate-300 font-medium">グローバル遅延との連動を解除</span>
            {!isCustom&&<span className="text-xs text-indigo-400 font-medium">（連動中）</span>}
            {isCustom&&<span className="text-xs text-amber-400 font-medium">（解除中・個別設定）</span>}
          </label>
          {isCustom&&(
            <div className="grid grid-cols-2 gap-2 pl-2 border-l-2 border-amber-500/50">
              <YMPicker label="予測開始" year={fcstStartYM.year} month={fcstStartYM.month} accent
                onChange={(y,m)=>s('fcstStartOffset', ymToOffset(baselineLaunchYear,baselineLaunchMonth,y,m))}/>
              <YMPicker label="予測終了" year={fcstEndYM.year} month={fcstEndYM.month} accent
                onChange={(y,m)=>s('fcstEndOffset', ymToOffset(baselineLaunchYear,baselineLaunchMonth,y,m))}/>
            </div>
          )}
        </div>

        <div className="flex gap-2 pt-1">
          <button onClick={()=>onSave(f)} className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-sm text-white font-semibold transition-colors">保存</button>
          <button onClick={onCancel} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-sm text-slate-300 transition-colors">✕</button>
        </div>
      </div>
    </div>
  );
}

// ─── GANTT TAB ────────────────────────────────────────────────────────────────
function GanttTab({project,delayMonths,timelineMonths,getFcstOffsets,updateProject}) {
  const minO=Math.min(...project.tasks.map(t=>t.startOffset))-1;
  const maxO=Math.max(...project.tasks.map(t=>{
    const {fcstEnd}=getFcstOffsets(t);
    return Math.max(t.endOffset,fcstEnd,3);
  }))+1;
  const vis=timelineMonths.filter(m=>m.offset>=minO&&m.offset<=maxO);
  const total=vis.length;
  function ci(offset){return vis.findIndex(m=>m.offset===offset);}
  function pct(n){return `${(n/total)*100}%`;}

  return(
    <div className="space-y-4 slide-in">
      {/* 発売日設定 */}
      <div className="bg-slate-900 border border-slate-800 p-5">
        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">発売日設定</p>
        <div className="grid grid-cols-2 gap-6">
          <LaunchDatePicker label="当初目標発売日" year={project.baselineLaunchYear} month={project.baselineLaunchMonth}
            onChange={(y,m)=>updateProject({baselineLaunchYear:y,baselineLaunchMonth:m})}/>
          <LaunchDatePicker label="現在の予測発売日" year={project.forecastLaunchYear} month={project.forecastLaunchMonth}
            onChange={(y,m)=>updateProject({forecastLaunchYear:y,forecastLaunchMonth:m})} accent/>
        </div>
        {delayMonths!==0&&(
          <div className={`mt-4 p-2.5 text-xs ${delayMonths>0?"bg-red-950/60 border border-red-800/60 text-red-300":"bg-emerald-950/60 border border-emerald-800/60 text-emerald-300"}`}>
            <span className="font-semibold">{delayMonths>0?`⚠ ${delayMonths}ヶ月の遅延が発生しています`:`✓ ${Math.abs(delayMonths)}ヶ月の前倒しです`}</span>
            <span className="ml-2 opacity-80">個別設定のないタスクは自動スライドします</span>
          </div>
        )}
      </div>

      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold text-white">進捗タイムライン（ガントチャート）</h2>
        <div className="flex items-center gap-4 text-xs text-slate-400">
          <span><span className="inline-block w-4 h-2 rounded-sm bg-slate-600 mr-1.5 align-middle"/>計画</span>
          <span><span className={`inline-block w-4 h-2 rounded-sm mr-1.5 align-middle ${delayMonths>0?"bg-red-500":delayMonths<0?"bg-emerald-500":"bg-indigo-500"}`}/>予測（連動）</span>
          <span><span className="inline-block w-4 h-2 rounded-sm bg-amber-500 mr-1.5 align-middle"/>予測（個別設定）</span>
        </div>
      </div>
      <div className="bg-slate-900 rounded-none border border-slate-800 overflow-hidden">
        {/* Header */}
        <div className="border-b border-slate-800 overflow-x-auto">
          <div className="flex" style={{minWidth:`${Math.max(700,total*56)}px`}}>
            <div className="w-44 shrink-0 px-4 py-3 text-xs font-semibold text-slate-400 border-r border-slate-800">タスク名</div>
            <div className="flex flex-1">
              {vis.map((m,i)=>{
                const isBase=m.offset===0;
                const isFcstDefault=m.offset===delayMonths&&delayMonths!==0;
                return(
                  <div key={i} className={`flex-1 py-3 text-center border-r border-slate-800/40 text-xs ${isBase?"bg-slate-700/30":isFcstDefault?"bg-indigo-950/40":""}`}>
                    <div className={`font-semibold ${isBase?"text-white":isFcstDefault?"text-indigo-300":"text-slate-400"}`}>{m.month}月</div>
                    <div className="text-slate-600 text-[9px]">{m.year}</div>
                    {isBase&&<div className="text-[9px] text-slate-400">📦</div>}
                    {isFcstDefault&&<div className="text-[9px] text-indigo-400">🚀</div>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        {/* Rows */}
        <div className="overflow-x-auto">
          <div style={{minWidth:`${Math.max(700,total*56)}px`}}>
            {project.tasks.map(task=>{
              const bs=ci(task.startOffset), be=ci(task.endOffset);
              const {fcstStart,fcstEnd,isCustom}=getFcstOffsets(task);
              const fs=ci(fcstStart), fe=ci(fcstEnd);
              const hasDelay=delayMonths!==0||isCustom;
              const barColor=isCustom?"#f59e0b":delayMonths>0?"#ef4444":"#10b981";

              return(
                <div key={task.id} className="border-b border-slate-800/40">
                  {/* 計画バー */}
                  <div className="flex" style={{height:'40px'}}>
                    <div className="w-44 shrink-0 px-3 flex items-center gap-2 border-r border-slate-800">
                      <div className="w-2 h-2 rounded-full shrink-0" style={{background:task.color}}/>
                      <span className="text-xs text-slate-300 font-medium truncate">{task.name}</span>
                      {isCustom&&<span title="個別設定中"><IcoPin s={10} c="text-amber-400 shrink-0"/></span>}
                    </div>
                    <div className="flex-1 relative">
                      {bs>=0&&be>=0&&(
                        <div className="gantt-bar absolute top-1/2 -translate-y-1/2 h-5 rounded flex items-center px-2"
                          style={{left:pct(bs),width:pct(be-bs+1),background:hasDelay?"#374151":task.color,opacity:hasDelay?0.5:1}}>
                          {!hasDelay&&<span className="text-white text-[10px] font-medium truncate">計画</span>}
                        </div>
                      )}
                    </div>
                  </div>
                  {/* 予測バー */}
                  {hasDelay&&(
                    <div className="flex" style={{height:'34px'}}>
                      <div className="w-44 shrink-0 px-3 flex items-center justify-end border-r border-slate-800">
                        {isCustom
                          ? <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-amber-950 text-amber-400">個別設定</span>
                          : <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded ${delayMonths>0?"bg-red-950 text-red-400":"bg-emerald-950 text-emerald-400"}`}>
                              {delayMonths>0?`+${delayMonths}M 遅延`:`${delayMonths}M 前倒し`}
                            </span>
                        }
                      </div>
                      <div className="flex-1 relative">
                        {fs>=0&&fe<total&&(
                          <div className="gantt-bar absolute top-1/2 -translate-y-1/2 h-4 rounded flex items-center px-2"
                            style={{left:pct(fs),width:pct(fe-fs+1),background:barColor}}>
                            <span className="text-white text-[10px] font-medium">予測</span>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
        <div className="px-4 py-3 bg-slate-900/50 border-t border-slate-800 flex gap-6 text-xs text-slate-500">
          <span>📦 計画発売日: {project.baselineLaunchYear}年{project.baselineLaunchMonth}月</span>
          {delayMonths!==0&&<span className="text-indigo-400">🚀 予測発売日: {project.forecastLaunchYear}年{project.forecastLaunchMonth}月</span>}
          {project.tasks.some(t=>t.fcstStartOffset!==null)&&<span className="text-amber-400">📌 個別設定ありのタスクがあります</span>}
        </div>
      </div>
    </div>
  );
}

// ─── SALES PLAN EDITOR ───────────────────────────────────────────────────────
function SalesPlanEditor({project, updateProject}) {
  const [open, setOpen] = useState(false);
  const plan = project.salesPlan;

  function setRev(mo, val) {
    const v = Math.max(0, Number(val) || 0);
    const exists = plan.find(p => p.mo === mo);
    const next = exists
      ? plan.map(p => p.mo === mo ? {...p, rev: v} : p)
      : [...plan, {mo, rev: v}].sort((a,b) => a.mo - b.mo);
    updateProject({salesPlan: next});
  }

  function addMonth() {
    const maxMo = plan.length ? Math.max(...plan.map(p => p.mo)) : 0;
    updateProject({salesPlan: [...plan, {mo: maxMo + 1, rev: 0}].sort((a,b)=>a.mo-b.mo)});
  }

  function removeMonth(mo) {
    updateProject({salesPlan: plan.filter(p => p.mo !== mo)});
  }

  // カレンダー月ラベル（計画発売日基準）
  function calLabel(mo) {
    const d = new Date(project.baselineLaunchYear, project.baselineLaunchMonth - 1 + mo, 1);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  const totalRev = plan.reduce((s,p) => s + p.rev, 0);

  return (
    <div className="border-t border-slate-800">
      {/* Header (クリックで開閉) */}
      <button
        onClick={() => setOpen(o => !o)}
        className="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-slate-800/40 transition-colors">
        <div className="flex items-center gap-2">
          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">売上計画</span>
          <span className="text-xs text-emerald-400 font-semibold">計{totalRev.toLocaleString()}万円</span>
        </div>
        <span className="text-slate-500 text-xs">{open ? '▲' : '▼'}</span>
      </button>

      {open && (
        <div className="px-4 pb-4 slide-in">
          <p className="text-xs text-slate-500 mb-3">発売後の月別売上計画（万円）。発売日変更時は自動スライドします。</p>
          <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
            {plan.sort((a,b)=>a.mo-b.mo).map(p => (
              <div key={p.mo} className="flex items-center gap-2">
                {/* 月ラベル */}
                <div className="w-16 shrink-0 text-xs text-slate-400 font-mono">
                  <span className="text-indigo-300 font-semibold">M+{p.mo}</span>
                </div>
                <div className="w-20 shrink-0 text-[10px] text-slate-500">{calLabel(p.mo)}</div>
                {/* 金額入力 */}
                <input
                  type="number"
                  min="0"
                  value={p.rev}
                  onChange={e => setRev(p.mo, e.target.value)}
                  className="flex-1 bg-slate-800 border border-slate-700 rounded-none px-2 py-1.5 text-sm text-white text-right focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/30"
                />
                <span className="text-xs text-slate-500 shrink-0">万</span>
                <button
                  onClick={() => removeMonth(p.mo)}
                  className="text-slate-600 hover:text-red-400 transition-colors shrink-0">
                  <IcoTrash s={13}/>
                </button>
              </div>
            ))}
          </div>

          {/* 月追加ボタン */}
          <button
            onClick={addMonth}
            className="mt-3 w-full flex items-center justify-center gap-1.5 py-2 border border-dashed border-slate-700 rounded-none text-xs text-slate-400 hover:text-emerald-400 hover:border-emerald-700 transition-colors">
            <IcoPlus s={13}/> 月を追加
          </button>

          {/* 合計 */}
          <div className="mt-3 flex items-center justify-between px-2 py-2 bg-slate-800/50 rounded-none">
            <span className="text-xs text-slate-400">発売後{plan.length}ヶ月累計売上</span>
            <span className="text-sm font-bold text-emerald-400">{totalRev.toLocaleString()}万円</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── COST TAB ─────────────────────────────────────────────────────────────────
function CostTab({costData,delayMonths}) {
  const [showTable,setShowTable]=useState(false);
  const active=costData.filter(d=>d.baseline>0||d.forecast>0);
  const gapData=active.map(d=>({...d,plan:d.baseline,forecast:d.forecast,gap:d.forecast-d.baseline}));
  const hasGap=gapData.some(d=>d.gap!==0);
  const totalB=costData.reduce((s,d)=>s+d.baseline,0);
  const peakB=Math.max(...costData.map(d=>d.baseline),0);

  return(
    <div className="space-y-5 slide-in">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold text-white">月別コスト推移（キャッシュアウト）</h2>
        {delayMonths!==0&&(
          <div className={`text-xs px-3 py-1.5 rounded-full font-semibold border ${delayMonths>0?"bg-red-950 text-red-400 border-red-800":"bg-emerald-950 text-emerald-400 border-emerald-800"}`}>
            コスト発生タイミングが{Math.abs(delayMonths)}ヶ月{delayMonths>0?"後倒し":"前倒し"}
          </div>
        )}
      </div>

      {/* 計画 vs 予測 棒グラフ */}
      <div className="bg-slate-900 rounded-none border border-slate-800 p-6">
        <p className="text-sm font-semibold text-slate-300 mb-4">計画 vs 予測コスト（月別）</p>
        <BarChartSVG data={active} keys={["baseline","forecast"]}
          colors={["#ef4444","#10b981"]}
          labels={["計画コスト","予測コスト"]} formatter={v=>`${Math.round(v)}万`}/>
      </div>

      {/* 差異バーチャート */}
      {hasGap&&(
        <div className="bg-slate-900 rounded-none border border-slate-800 p-6">
          <div className="flex items-center justify-between mb-1">
            <p className="text-sm font-semibold text-slate-300">月別コスト差異（予測 − 計画）</p>
            <div className="flex items-center gap-3 text-xs text-slate-500">
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-red-500 inline-block"/>計画コスト</span>
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-emerald-500 inline-block"/>予測コスト</span>
            </div>
          </div>
          <p className="text-xs text-slate-500 mb-4">マイナス＝計画月にコストが未発生（後のタスクにシフト）　プラス＝当初計画より追加でコスト発生</p>
          <GapBarChart data={gapData} valueKey="gap" height={180}/>
          {/* テーブル展開 */}
          <button onClick={()=>setShowTable(!showTable)}
            className="mt-3 text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
            {showTable?"▲ 月別詳細を閉じる":"▼ 月別詳細を表示"}
          </button>
          {showTable&&(
            <div className="mt-3 bg-slate-800/50 rounded-none overflow-hidden">
              <GapTable data={gapData} planKey="plan" fcstKey="forecast" gapKey="gap" sign="cost"/>
            </div>
          )}
        </div>
      )}

      <div className="grid grid-cols-3 gap-4">
        <StatCard label="総開発コスト（計画）" value={`${totalB.toLocaleString()}万円`} sub="計画ベース合計"/>
        <StatCard label="ピーク月コスト（計画）" value={`${peakB.toLocaleString()}万円`} sub="最大月次支出"/>
        {delayMonths!==0&&(
          <StatCard label="コストピーク月シフト" value={`${Math.abs(delayMonths)}ヶ月 ${delayMonths>0?"後倒し":"前倒し"}`}
            sub="キャッシュフローへの影響" valueClass={delayMonths>0?"text-red-400":"text-emerald-400"}/>
        )}
      </div>
    </div>
  );
}

        <div className="bg-slate-900 rounded-none border border-red-900/40 p-6">
          <div className="flex items-center justify-between mb-1">
            <h3 className="text-sm font-semibold text-slate-300">月別売上差異（予測 − 計画）</h3>
            <div className="flex items-center gap-3 text-xs text-slate-500">
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-red-500 inline-block"/>機会損失</span>
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-emerald-500 inline-block"/>早期売上</span>
            </div>
          </div>
          <p className="text-xs text-slate-500 mb-4">
            マイナス＝計画より売上が少ない月（発売遅延による機会損失）　プラス＝計画を上回る月
          </p>
          <GapBarChart data={gapData} valueKey="gap" height={200}/>

          {/* テーブル展開 */}
          <button onClick={()=>setShowTable(!showTable)}
            className="mt-3 text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
            {showTable?"▲ 月別詳細を閉じる":"▼ 月別詳細を表示（計画 / 予測 / 差異）"}
          </button>
          {showTable&&(
            <div className="mt-3 bg-slate-800/50 rounded-none overflow-hidden">
              <GapTable data={gapData} planKey="plan" fcstKey="forecast" gapKey="gap" sign="revenue"/>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [projects,setProjects]=useState(loadProjects);
  const [selectedId,setSelectedId]=useState(1);
  const [activeTab,setActiveTab]=useState(0);
  const [editingTask,setEditingTask]=useState(null);
  const [showNewProject,setShowNewProject]=useState(false);
  const [newProjectName,setNewProjectName]=useState("");

  useEffect(()=>{ saveProjects(projects); },[projects]);

  const project=useMemo(()=>projects.find(p=>p.id===selectedId)||projects[0],[projects,selectedId]);

  const updateProject=useCallback((patch)=>{
    setProjects(prev=>prev.map(p=>p.id===project.id?{...p,...patch}:p));
  },[project]);

  const delayMonths=useMemo(()=>
    monthDiff(project.baselineLaunchYear,project.baselineLaunchMonth,
              project.forecastLaunchYear,project.forecastLaunchMonth),
  [project]);

  // タスクの予測オフセットを計算（個別設定 or グローバル連動）
  const getFcstOffsets = useCallback((task)=>{
    const isCustom = task.fcstStartOffset!==null && task.fcstStartOffset!==undefined;
    return {
      fcstStart: isCustom ? task.fcstStartOffset : task.startOffset + delayMonths,
      fcstEnd:   (task.fcstEndOffset!==null&&task.fcstEndOffset!==undefined)
                 ? task.fcstEndOffset : task.endOffset + delayMonths,
      isCustom,
    };
  },[delayMonths]);

  // タイムライン範囲
  const timelineMonths=useMemo(()=>{
    const minO=Math.min(...project.tasks.map(t=>t.startOffset))-1;
    const maxO=Math.max(...project.tasks.map(t=>{
      const {fcstEnd}=getFcstOffsets(t);
      return Math.max(t.endOffset,fcstEnd,12);
    }))+1;
    const arr=[];
    for(let o=minO;o<=maxO;o++){
      const b=addMonths(project.baselineLaunchYear,project.baselineLaunchMonth,o);
      arr.push({offset:o,...b,label:monthLabel(b.year,b.month)});
    }
    return arr;
  },[project,getFcstOffsets]);

  // コストデータ（計画・予測それぞれ独立計算）
  const costData=useMemo(()=>{
    const map={};
    timelineMonths.forEach(m=>{ map[m.offset]={label:m.label,baseline:0,forecast:0}; });
    project.tasks.forEach(task=>{
      const {fcstStart,fcstEnd}=getFcstOffsets(task);
      // 計画コスト
      const durB=task.endOffset-task.startOffset+1;
      const monthlyB=task.costType==="spread"?task.cost/durB:0;
      for(let o=task.startOffset;o<=task.endOffset;o++){
        const val=task.costType==="lump"?(o===task.endOffset?task.cost:0):monthlyB;
        if(map[o]) map[o].baseline+=val;
      }
      // 予測コスト
      const durF=fcstEnd-fcstStart+1;
      const monthlyF=task.costType==="spread"?task.cost/Math.max(1,durF):0;
      for(let o=fcstStart;o<=fcstEnd;o++){
        const val=task.costType==="lump"?(o===fcstEnd?task.cost:0):monthlyF;
        if(map[o]) map[o].forecast+=val;
      }
    });
    return timelineMonths.map(m=>({
      label:m.label, offset:m.offset,
      baseline:Math.round(map[m.offset]?.baseline||0),
      forecast:Math.round(map[m.offset]?.forecast||0),
    }));
  },[project,timelineMonths,getFcstOffsets]);

  // 売上データ
  const salesData=useMemo(()=>{
    const sm={};
    project.salesPlan.forEach(s=>{sm[s.mo]=s.rev;});
    let cumBase=0,cumFcst=0;
    return timelineMonths.map(m=>{
      const br=m.offset>=1?(sm[m.offset]||0):0;
      const fr=(m.offset-delayMonths)>=1?(sm[m.offset-delayMonths]||0):0;
      cumBase+=br; cumFcst+=fr;
      return {label:m.label,offset:m.offset,baseRev:br,fcstRev:fr,loss:br-fr,
              cumBase,cumForecast:cumFcst,cumLoss:cumBase-cumFcst};
    });
  },[project,timelineMonths,delayMonths]);

  const totalLoss=useMemo(()=>{
    const now={year:new Date().getFullYear(),month:new Date().getMonth()+1};
    const todayOff=monthDiff(project.baselineLaunchYear,project.baselineLaunchMonth,now.year,now.month);
    const row=salesData.find(d=>d.offset===todayOff)||salesData[salesData.length-1];
    return row?.cumLoss||0;
  },[salesData,project]);

  // プロジェクト追加
  function addProject(){
    if(!newProjectName.trim()) return;
    const id=Math.max(...projects.map(p=>p.id))+1;
    setProjects(prev=>[...prev,{
      id, name:newProjectName.trim(),
      baselineLaunchYear:2027,baselineLaunchMonth:4,
      forecastLaunchYear:2027,forecastLaunchMonth:4,
      tasks:[
        {id:1,name:"企画・調査",startOffset:-6,endOffset:-4,cost:50, costType:"lump",color:"#6366f1",fcstStartOffset:null,fcstEndOffset:null},
        {id:2,name:"開発・製造",startOffset:-4,endOffset:-1,cost:200,costType:"lump",color:"#f59e0b",fcstStartOffset:null,fcstEndOffset:null},
        {id:3,name:"販促",     startOffset:-1,endOffset:2, cost:80, costType:"lump",color:"#10b981",fcstStartOffset:null,fcstEndOffset:null},
      ],
      salesPlan:Array.from({length:12},(_,i)=>({mo:i+1,rev:0})),
    }]);
    setSelectedId(id);
    setShowNewProject(false);
    setNewProjectName("");
  }

  function deleteProject(id){
    if(projects.length<=1) return;
    setProjects(prev=>prev.filter(p=>p.id!==id));
    if(selectedId===id) setSelectedId(projects.find(p=>p.id!==id)?.id);
  }

  function saveTask(f){
    const tasks=editingTask.id==="new"
      ?[...project.tasks,{...f,id:Date.now(),color:`hsl(${Math.random()*360},70%,55%)`}]
      :project.tasks.map(t=>t.id===editingTask.id?{...t,...f}:t);
    updateProject({tasks});
    setEditingTask(null);
  }

  const TABS=["進捗タイムライン","月別コスト推移","売上・インパクト分析"];

  return(
    <div className="min-h-screen bg-slate-950 flex flex-col">
      {/* Header */}
      <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center gap-4">
        <div className="w-8 h-8 rounded-none bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
          <IcoTrend s={16} c="text-white"/>
        </div>
        <div>
          <h1 className="text-lg font-bold text-white leading-tight">新商品開発プロセス進捗シミュレーター</h1>
          <p className="text-xs text-slate-400">発売日変更が財務インパクトに与える影響をリアルタイム分析</p>
        </div>
        {delayMonths!==0&&(
          <div className={`ml-auto flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border ${delayMonths>0?"bg-red-950 text-red-400 border-red-800":"bg-emerald-950 text-emerald-400 border-emerald-800"}`}>
            <IcoAlert s={12}/>
            {delayMonths>0?`${delayMonths}ヶ月遅延中`:`${Math.abs(delayMonths)}ヶ月前倒し`}
          </div>
        )}
      </header>

      <div className="flex flex-1 overflow-hidden">
        {/* LEFT */}
        <aside className="w-80 min-w-[300px] bg-slate-900 border-r border-slate-800 flex flex-col overflow-y-auto">
          {/* Project selector */}
          <div className="p-4 border-b border-slate-800">
            <div className="flex items-center justify-between mb-3">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">プロジェクト</span>
              <button onClick={()=>setShowNewProject(true)} className="text-indigo-400 hover:text-indigo-300"><IcoPlus s={16}/></button>
            </div>
            {showNewProject&&(
              <div className="mb-3 flex gap-2">
                <input className="flex-1 bg-slate-800 border border-slate-700 rounded-none px-2 py-1.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                  placeholder="プロジェクト名" value={newProjectName} onChange={e=>setNewProjectName(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&addProject()} autoFocus/>
                <button onClick={addProject} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-none text-xs text-white font-semibold transition-colors">追加</button>
                <button onClick={()=>setShowNewProject(false)} className="px-2 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-none text-xs text-slate-300 transition-colors">✕</button>
              </div>
            )}
            <div className="space-y-1">
              {projects.map(p=>(
                <div key={p.id} onClick={()=>setSelectedId(p.id)}
                  className={`flex items-center justify-between px-3 py-2 rounded-none cursor-pointer transition-colors ${p.id===selectedId?"bg-indigo-600 text-white":"text-slate-300 hover:bg-slate-800"}`}>
                  <span className="text-sm font-medium truncate">{p.name}</span>
                  {projects.length>1&&(
                    <button onClick={e=>{e.stopPropagation();deleteProject(p.id);}} className="opacity-50 hover:opacity-100 hover:text-red-400 ml-2 shrink-0">
                      <IcoTrash s={14}/>
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* Tasks */}
          <div className="p-4 flex-1">
            <div className="flex items-center justify-between mb-3">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">開発タスク</span>
              <button onClick={()=>setEditingTask({id:"new",name:"",startOffset:-6,endOffset:-1,cost:0,costType:"lump",fcstStartOffset:null,fcstEndOffset:null})}
                className="text-indigo-400 hover:text-indigo-300"><IcoPlus s={16}/></button>
            </div>
            {editingTask&&<TaskForm task={editingTask}
              baselineLaunchYear={project.baselineLaunchYear}
              baselineLaunchMonth={project.baselineLaunchMonth}
              delayMonths={delayMonths} onSave={saveTask} onCancel={()=>setEditingTask(null)}/>}
            <div className="space-y-2">
              {project.tasks.map(task=>{
                const {fcstStart,fcstEnd,isCustom}=getFcstOffsets(task);
                const planS=offsetToYM(project.baselineLaunchYear,project.baselineLaunchMonth,task.startOffset);
                const planE=offsetToYM(project.baselineLaunchYear,project.baselineLaunchMonth,task.endOffset);
                const fcstS=offsetToYM(project.baselineLaunchYear,project.baselineLaunchMonth,fcstStart);
                const fcstE=offsetToYM(project.baselineLaunchYear,project.baselineLaunchMonth,fcstEnd);
                return(
                  <div key={task.id} className={`p-3 border ${isCustom?"bg-amber-950/20 border-amber-700/50":"bg-slate-800 border-slate-700"}`}>
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex items-center gap-2 min-w-0">
                        <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{background:task.color}}/>
                        <span className="text-sm text-white font-medium truncate">{task.name}</span>
                        {isCustom&&<IcoPin s={10} c="text-amber-400 shrink-0"/>}
                      </div>
                      <div className="flex gap-1 shrink-0">
                        <button onClick={()=>setEditingTask({...task})} className="text-slate-500 hover:text-indigo-400 transition-colors"><IcoEdit s={13}/></button>
                        <button onClick={()=>updateProject({tasks:project.tasks.filter(t=>t.id!==task.id)})} className="text-slate-500 hover:text-red-400 transition-colors"><IcoTrash s={13}/></button>
                      </div>
                    </div>
                    <div className="mt-1.5 text-xs text-slate-400">
                      計画: {planS.year}/{String(planS.month).padStart(2,'0')} 〜 {planE.year}/{String(planE.month).padStart(2,'0')}
                      {task.cost>0&&<span className="ml-2 text-amber-400 font-semibold">¥{task.cost.toLocaleString()}万</span>}
                    </div>
                    {(isCustom||(delayMonths!==0&&!isCustom))&&(
                      <div className={`mt-0.5 text-xs ${isCustom?"text-amber-400/80":"text-indigo-400/70"}`}>
                        予測: {fcstS.year}/{String(fcstS.month).padStart(2,'0')} 〜 {fcstE.year}/{String(fcstE.month).padStart(2,'0')}
                        {isCustom&&<span className="ml-1 text-amber-500">📌</span>}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="mt-4 grid grid-cols-2 gap-2">
              <MiniStat label="総開発コスト" value={`${project.tasks.reduce((s,t)=>s+t.cost,0).toLocaleString()}万円`}/>
              <MiniStat label="機会損失（累計）" value={totalLoss>0?`-${totalLoss.toLocaleString()}万円`:"なし"} valueClass={totalLoss>0?"text-red-400":"text-emerald-400"}/>
            </div>
          </div>

          {/* 売上計画エディター */}
          <SalesPlanEditor project={project} updateProject={updateProject}/>
        </aside>

        {/* RIGHT */}
        <main className="flex-1 flex flex-col overflow-hidden">
          <div className="bg-slate-900 border-b border-slate-800 px-6 flex gap-1 pt-2">
            {TABS.map((tab,i)=>(
              <button key={i} onClick={()=>setActiveTab(i)}
                className={`px-4 py-2.5 text-sm font-medium rounded-none transition-colors ${activeTab===i?"bg-slate-950 text-indigo-400 border-x border-t border-slate-700":"text-slate-400 hover:text-slate-200"}`}>
                {tab}
              </button>
            ))}
          </div>
          <div className="flex-1 overflow-auto p-6 bg-slate-950">
            {activeTab===0&&<GanttTab project={project} delayMonths={delayMonths} timelineMonths={timelineMonths} getFcstOffsets={getFcstOffsets} updateProject={updateProject}/>}
            {activeTab===1&&<CostTab costData={costData} delayMonths={delayMonths}/>}
            {activeTab===2&&<SalesTab salesData={salesData} totalLoss={totalLoss} delayMonths={delayMonths} project={project}/>}
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
