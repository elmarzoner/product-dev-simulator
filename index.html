  const d=new Date(year,month-1+delta,1);

/** 正負両方向の差異バーチャート */
function GapBarChart({data, labelKey="label", valueKey="gap", height=200}) {
  const W=700, H=height, padL=58, padR=16, padT=20, padB=52;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const vals=data.map(d=>d[valueKey]||0);
  const maxAbs=Math.max(...vals.map(v=>Math.abs(v)),1);
  const [tip,setTip]=useState(null);

  const zero=padT+innerH/2; // ゼロライン位置
  const barW=Math.max(4,innerW/data.length*0.65);
  const halfH=innerH/2;

  function barY(v){return v>=0?zero-((v/maxAbs)*halfH):zero;}
  function barH(v){return (Math.abs(v)/maxAbs)*halfH;}

  const ticks=[-maxAbs,-maxAbs/2,0,maxAbs/2,maxAbs];
  return (
    <div className="relative" style={{width:'100%',aspectRatio:`${W}/${H}`}}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
        {/* grid */}
        {ticks.map((t,i)=>{
          const y=padT+innerH/2-(t/maxAbs)*halfH;
          return(
            <g key={i}>
              <line x1={padL} y1={y} x2={W-padR} y2={y} stroke={t===0?"#475569":"#1e293b"} strokeWidth={t===0?1.5:1} strokeDasharray={t===0?"0":"3 3"}/>
              <text x={padL-6} y={y+4} textAnchor="end" fill="#64748b" fontSize={10}>{Math.round(t)}万</text>
            </g>
          );
        })}
        {/* bars */}
        {data.map((d,i)=>{
          const v=d[valueKey]||0;
          const x=padL+(i/data.length)*innerW+(innerW/data.length-barW)/2;
          return(
            <rect key={i} x={x} y={barY(v)} width={barW} height={Math.max(2,barH(v))}
              fill={v>=0?"#10b981":"#ef4444"} rx={3}
              onMouseEnter={e=>setTip({x:e.clientX,y:e.clientY,d,i})}
              onMouseLeave={()=>setTip(null)}
              className="cursor-pointer"/>
          );
        })}
        {/* x labels */}
        {data.map((d,i)=>(i%Math.ceil(data.length/12)===0&&(
          <text key={i} x={padL+(i+0.5)/data.length*innerW} y={H-padB+16}
            textAnchor="middle" fill="#64748b" fontSize={9}
            transform={`rotate(-45,${padL+(i+0.5)/data.length*innerW},${H-padB+16})`}>
            {d[labelKey]}
          </text>
        )))}
        <line x1={padL} y1={zero} x2={W-padR} y2={zero} stroke="#64748b" strokeWidth={1}/>
      </svg>
      {tip&&(
        <div className="fixed z-50 bg-slate-800 border border-slate-700 rounded-none px-3 py-2 text-xs shadow-xl pointer-events-none"
          style={{left:tip.x+12,top:tip.y-50}}>
          <div className="text-slate-300 font-semibold mb-1">{tip.d[labelKey]}</div>
          <div className="flex flex-col gap-0.5">
            <span className="text-slate-400">計画: <span className="text-white font-bold">{Math.round(tip.d.plan||0).toLocaleString()}万円</span></span>
            <span className="text-slate-400">予測: <span className="text-white font-bold">{Math.round(tip.d.forecast||0).toLocaleString()}万円</span></span>
            <span className={`font-bold ${(tip.d[valueKey]||0)>=0?"text-emerald-400":"text-red-400"}`}>
              差異: {(tip.d[valueKey]||0)>=0?"+":" "}{Math.round(tip.d[valueKey]||0).toLocaleString()}万円
            </span>
          </div>
        </div>
      )}
    </div>
  );
}

/** 通常の積み上げ/並列棒グラフ */
function BarChartSVG({data,keys,colors,labels,height=260,formatter=(v)=>`${v}万`}) {
  const W=700,H=height,padL=58,padR=16,padT=16,padB=52;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const maxVal=Math.max(...data.flatMap(d=>keys.map(k=>d[k]||0)),1);
  const barW=Math.max(4,(innerW/data.length)*0.7/keys.length);
  const groupW=innerW/data.length;
  const [tip,setTip]=useState(null);
  const yTicks=5;
  return(
    <div className="relative" style={{width:'100%',aspectRatio:`${W}/${H}`}}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
        {Array.from({length:yTicks+1},(_,i)=>{
          const y=padT+innerH-(i/yTicks)*innerH;
          return(<g key={i}>
            <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="#1e293b" strokeWidth={1}/>
            <text x={padL-6} y={y+4} textAnchor="end" fill="#64748b" fontSize={10}>{formatter(Math.round((i/yTicks)*maxVal))}</text>
          </g>);
        })}
        {data.map((d,di)=>{
          const gx=padL+di*groupW+groupW*0.15;
          return keys.map((k,ki)=>{
            const val=d[k]||0;
            const bh=(val/maxVal)*innerH;
            const x=gx+ki*(barW+2);
            const y=padT+innerH-bh;
            return(<rect key={k} x={x} y={y} width={barW} height={bh} fill={colors[ki]}
              rx={3} opacity={0.9}
              onMouseEnter={e=>setTip({x:e.clientX,y:e.clientY,d,di})}
              onMouseLeave={()=>setTip(null)}
              className="cursor-pointer"/>);
          });
        })}
        {data.map((d,di)=>(di%Math.ceil(data.length/12)===0&&(
          <text key={di} x={padL+di*groupW+groupW/2} y={H-padB+16}
            textAnchor="middle" fill="#64748b" fontSize={9}
            transform={`rotate(-45,${padL+di*groupW+groupW/2},${H-padB+16})`}>
            {d.label}
          </text>
        )))}
        {keys.map((k,ki)=>(
          <g key={k} transform={`translate(${padL+ki*140},${H-8})`}>
            <rect x={0} y={-8} width={10} height={10} fill={colors[ki]} rx={2}/>
            <text x={14} y={0} fill="#94a3b8" fontSize={11}>{labels[ki]}</text>
          </g>
        ))}
      </svg>
      {tip&&(
        <div className="fixed z-50 bg-slate-800 border border-slate-700 rounded-none px-3 py-2 text-xs shadow-xl pointer-events-none"
          style={{left:tip.x+12,top:tip.y-40}}>
          <div className="text-slate-300 font-semibold mb-1">{data[tip.di].label}</div>
          {keys.map((k,ki)=>(
            <div key={k} className="flex items-center gap-2">
              <div className="w-2 h-2 rounded-full" style={{background:colors[ki]}}/>
              <span className="text-slate-400">{labels[ki]}:</span>
              <span className="text-white font-bold">{formatter(data[tip.di][k]||0)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/** 折れ線グラフ */
function LineChartSVG({data,keys,colors,labels,height=240,formatter=(v)=>`${v}万`}) {
  const W=700,H=height,padL=68,padR=16,padT=16,padB=52;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const maxVal=Math.max(...data.flatMap(d=>keys.map(k=>d[k]||0)),1);
  const [tip,setTip]=useState(null);
  const n=data.length;
  function px(i){return padL+(i/(n-1))*innerW;}
  function py(v){return padT+innerH-(v/maxVal)*innerH;}
  const yTicks=5;
  const gw=innerW/n;
  return(
    <div className="relative" style={{width:'100%',aspectRatio:`${W}/${H}`}}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
        {Array.from({length:yTicks+1},(_,i)=>{
          const y=padT+innerH-(i/yTicks)*innerH;
          return(<g key={i}>
            <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="#1e293b" strokeWidth={1}/>
            <text x={padL-6} y={y+4} textAnchor="end" fill="#64748b" fontSize={10}>{formatter(Math.round((i/yTicks)*maxVal))}</text>
          </g>);
        })}
        {keys.map((k,ki)=>(
          <polygon key={`area-${k}`}
            points={`${px(0)},${padT+innerH} ${data.map((_,i)=>`${px(i)},${py(data[i][k]||0)}`).join(' ')} ${px(n-1)},${padT+innerH}`}
            fill={colors[ki]} opacity={0.06}/>
        ))}
        {keys.map((k,ki)=>(
          <polyline key={k}
            points={data.map((_,i)=>`${px(i)},${py(data[i][k]||0)}`).join(' ')}
            fill="none" stroke={colors[ki]} strokeWidth={2.5} strokeLinejoin="round"
            strokeDasharray={ki>0?"8 4":"0"}/>
        ))}
        {data.map((_,i)=>(
          <rect key={i} x={px(i)-gw/2} y={padT} width={gw} height={innerH} fill="transparent"
            onMouseEnter={e=>setTip({x:e.clientX,y:e.clientY,i})}
            onMouseLeave={()=>setTip(null)}/>
        ))}
        {data.map((d,i)=>(i%Math.ceil(n/10)===0&&(
          <text key={i} x={px(i)} y={H-padB+16} textAnchor="middle" fill="#64748b" fontSize={9}
            transform={`rotate(-45,${px(i)},${H-padB+16})`}>{d.label}</text>
        )))}
        {keys.map((k,ki)=>(
          <g key={k} transform={`translate(${padL+ki*180},${H-8})`}>
            <line x1={0} y1={-4} x2={14} y2={-4} stroke={colors[ki]} strokeWidth={2.5} strokeDasharray={ki>0?"6 3":"0"}/>
            <text x={18} y={0} fill="#94a3b8" fontSize={11}>{labels[ki]}</text>
          </g>
        ))}
      </svg>
      {tip&&(()=>{
        const d=data[tip.i];
        return(
          <div className="fixed z-50 bg-slate-800 border border-slate-700 rounded-none px-3 py-2 text-xs shadow-xl pointer-events-none"
            style={{left:tip.x+12,top:tip.y-40}}>
            <div className="text-slate-300 font-semibold mb-1">{d.label}</div>
            {keys.map((k,ki)=>(
              <div key={k} className="flex items-center gap-2">
                <div className="w-2 h-2 rounded-full" style={{background:colors[ki]}}/>
                <span className="text-slate-400">{labels[ki]}:</span>
                <span className="text-white font-bold">{formatter(d[k]||0)}</span>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

// ─── 月別差異テーブル ────────────────────────────────────────────────────────
function GapTable({data,planKey,fcstKey,gapKey,labelKey="label",unit="万円",sign="cost"}) {
  // sign="cost": 差異がマイナス = コスト未発生（後月にシフト）, sign="revenue": 差異がマイナス = 機会損失（警告）
  const rows=data.filter(d=>(d[planKey]||0)!==0||(d[fcstKey]||0)!==0);
  if(rows.length===0) return null;
  return(
    <div className="overflow-x-auto">
      <table className="w-full text-xs border-collapse">
        <thead>
          <tr className="border-b border-slate-700">
            <th className="text-left py-2 px-3 text-slate-400 font-semibold">月</th>
            <th className="text-right py-2 px-3 text-slate-400 font-semibold">計画</th>
            <th className="text-right py-2 px-3 text-slate-400 font-semibold">予測</th>
            <th className="text-right py-2 px-3 text-slate-400 font-semibold">差異</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((d,i)=>{
            const plan=Math.round(d[planKey]||0);
            const fcst=Math.round(d[fcstKey]||0);
            const gap=Math.round(d[gapKey]||0);
            const isNeg=gap<0;
            const isPos=gap>0;
            // cost: 差異がマイナス = コスト先送り(グレー), 差異がプラス = 追加コスト(赤)
            // revenue: 差異がマイナス = 機会損失(赤), 差異がプラス = 早期売上(緑)
            let badgeColor, badgeText;
            if(gap===0){badgeColor="text-slate-500";badgeText="";}
            else if(sign==="cost"){
              if(isNeg){badgeColor="text-slate-400";badgeText="計画コスト";}
              else{badgeColor="text-red-400";badgeText="予測コスト";}
            }else{
              if(isNeg){badgeColor="text-red-400";badgeText="機会損失";}
              else{badgeColor="text-emerald-400";badgeText="早期売上";}
            }
            return(

// ─── DATE HELPERS ─────────────────────────────────────────────────────────────
function offsetToYM(baseYear, baseMonth, offset) {
  const d = new Date(baseYear, baseMonth - 1 + offset, 1);
  return { year: d.getFullYear(), month: d.getMonth() + 1 };
}
function ymToOffset(baseYear, baseMonth, year, month) {
  return (year - baseYear) * 12 + (month - baseMonth);
}

// ─── FISCAL YEAR HELPERS (4月始まり、144期=2026年4月～2027年3月) ────────────
const FY_BASE_PERIOD = 144;
const FY_BASE_YEAR = 2026;
function periodToFY(p)   { return FY_BASE_YEAR + (p - FY_BASE_PERIOD); }
function fyToPeriod(fy)  { return FY_BASE_PERIOD + (fy - FY_BASE_YEAR); }
function fiscalYearOfYM(y, m) { return m >= 4 ? y : y - 1; }
function fiscalMonths(fy) {
  const arr = [];
  for (let i = 0; i < 12; i++) {
    const m0 = 4 + i;
    arr.push(m0 <= 12 ? { year: fy, month: m0 } : { year: fy + 1, month: m0 - 12 });
  }
  return arr;
}

// 1プロジェクトを年月キー(YYYY-MM)で集計（コスト=一括・終了月／売上=salesPlan）
function projectMonthlyAggregate(project) {
  const delay = monthDiff(project.baselineLaunchYear, project.baselineLaunchMonth,
                          project.forecastLaunchYear, project.forecastLaunchMonth);
  const map = {};
  const bump = (y, m, key, val) => {
    const k = `${y}-${String(m).padStart(2,'0')}`;
    if (!map[k]) map[k] = { planCost:0, fcstCost:0, planRev:0, fcstRev:0 };
    map[k][key] += val;
  };
  project.tasks.forEach(task => {
    // 計画コスト：終了月に一括
    const planEnd = offsetToYM(project.baselineLaunchYear, project.baselineLaunchMonth, task.endOffset);
    bump(planEnd.year, planEnd.month, 'planCost', task.cost);
    // 予測コスト：個別設定 or グローバル遅延
    const isCustom = task.fcstEndOffset !== null && task.fcstEndOffset !== undefined;
    const fcstEndOff = isCustom ? task.fcstEndOffset : task.endOffset + delay;
    const fcstEnd = offsetToYM(project.baselineLaunchYear, project.baselineLaunchMonth, fcstEndOff);
    bump(fcstEnd.year, fcstEnd.month, 'fcstCost', task.cost);
  });
  project.salesPlan.forEach(sp => {
    const planYM = offsetToYM(project.baselineLaunchYear, project.baselineLaunchMonth, sp.mo);
    bump(planYM.year, planYM.month, 'planRev', sp.rev);
    const fcstYM = offsetToYM(project.forecastLaunchYear, project.forecastLaunchMonth, sp.mo);
    bump(fcstYM.year, fcstYM.month, 'fcstRev', sp.rev);
  });
  return map;
}

// ─── GANTT TAB ────────────────────────────────────────────────────────────────
function GanttTab({project,delayMonths,timelineMonths,getFcstOffsets,updateProject}) {
  const minO=Math.min(...project.tasks.map(t=>t.startOffset))-1;
  const maxO=Math.max(...project.tasks.map(t=>{
    const {fcstEnd}=getFcstOffsets(t);
    return Math.max(t.endOffset,fcstEnd,3);
  }))+1;
  const vis=timelineMonths.filter(m=>m.offset>=minO&&m.offset<=maxO);
  const total=vis.length;
  function ci(offset){return vis.findIndex(m=>m.offset===offset);}
  function pct(n){return `${(n/total)*100}%`;}

  // 本日の位置（baselineLaunch基準のoffset）
  const today=new Date();
  const todayOffset=monthDiff(project.baselineLaunchYear,project.baselineLaunchMonth,today.getFullYear(),today.getMonth()+1);
  const dayOfMonth=today.getDate(); const daysInMonth=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  const todayFracIdx=ci(todayOffset)+(dayOfMonth-1)/daysInMonth;
  const showTodayLine=todayFracIdx>=0 && todayFracIdx<=total;

  return(
    <div className="space-y-4 slide-in">
      {/* 発売日設定 */}
      <div className="bg-slate-900 border border-slate-800 p-5">
        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">発売日設定</p>
        <div className="grid grid-cols-2 gap-6">
          <LaunchDatePicker label="当初目標発売日" year={project.baselineLaunchYear} month={project.baselineLaunchMonth}
            onChange={(y,m)=>updateProject({baselineLaunchYear:y,baselineLaunchMonth:m})}/>
          <LaunchDatePicker label="現在の予測発売日" year={project.forecastLaunchYear} month={project.forecastLaunchMonth}
            onChange={(y,m)=>updateProject({forecastLaunchYear:y,forecastLaunchMonth:m})} accent/>
        </div>
        {delayMonths!==0&&(
          <div className={`mt-4 p-2.5 text-xs ${delayMonths>0?"bg-red-950/60 border border-red-800/60 text-red-300":"bg-emerald-950/60 border border-emerald-800/60 text-emerald-300"}`}>
            <span className="font-semibold">{delayMonths>0?`⚠ ${delayMonths}ヶ月の遅延が発生しています`:`✓ ${Math.abs(delayMonths)}ヶ月の前倒しです`}</span>
            <span className="ml-2 opacity-80">個別設定のないタスクは自動スライドします</span>
          </div>
        )}
      </div>

      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold text-white">進捗タイムライン（ガントチャート）</h2>
        <div className="flex items-center gap-4 text-xs text-slate-400">
          <span><span className="inline-block w-4 h-2 rounded-sm bg-blue-500 mr-1.5 align-middle"/>計画</span>
          <span><span className={`inline-block w-4 h-2 rounded-sm mr-1.5 align-middle ${delayMonths>0?"bg-red-500":delayMonths<0?"bg-emerald-500":"bg-indigo-500"}`}/>予測（連動）</span>
          <span><span className="inline-block w-4 h-2 rounded-sm bg-amber-500 mr-1.5 align-middle"/>予測（個別設定）</span>
        </div>
      </div>
      <div className="bg-slate-900 rounded-none border border-slate-800 overflow-hidden">
        {/* 1つのスクロール領域に統合（タスク名列はsticky） */}
        <div className="overflow-x-auto">
          <div style={{minWidth:`${Math.max(700,total*56)}px`,position:'relative'}}>
            {/* 本日縦線（タスク名列の176pxをスキップ） */}
            {showTodayLine && (
              <div className="absolute top-0 bottom-0 pointer-events-none z-10"
                style={{left:`calc(176px + (100% - 176px) * ${todayFracIdx/total})`,width:'2px',background:'#facc15',boxShadow:'0 0 8px rgba(250,204,21,0.6)'}}>
                <div className="absolute -top-1 -left-2 text-[9px] text-yellow-300 font-bold whitespace-nowrap">今日</div>

                      )}

                  {hasDelay&&(
                    <div className="flex" style={{height:'34px'}}>

                        {isCustom
                          ? <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-amber-950 text-amber-400">個別設定</span>

          <span>📦 計画発売日: {project.baselineLaunchYear}年{project.baselineLaunchMonth}月</span>

// ─── SALES PLAN EDITOR ───────────────────────────────────────────────────────
function SalesPlanEditor({project, updateProject}) {
  const [open, setOpen] = useState(false);
  const plan = project.salesPlan;

  function setRev(mo, val) {
    const v = Math.max(0, Number(val) || 0);
    const exists = plan.find(p => p.mo === mo);
    const next = exists
      ? plan.map(p => p.mo === mo ? {...p, rev: v} : p)
      : [...plan, {mo, rev: v}].sort((a,b) => a.mo - b.mo);
    updateProject({salesPlan: next});
  }

  function addMonth() {
    const maxMo = plan.length ? Math.max(...plan.map(p => p.mo)) : 0;
    updateProject({salesPlan: [...plan, {mo: maxMo + 1, rev: 0}].sort((a,b)=>a.mo-b.mo)});
  }

  function removeMonth(mo) {
    updateProject({salesPlan: plan.filter(p => p.mo !== mo)});
  }

  // カレンダー月ラベル（計画発売日基準）
  function calLabel(mo) {
    const d = new Date(project.baselineLaunchYear, project.baselineLaunchMonth - 1 + mo, 1);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  const totalRev = plan.reduce((s,p) => s + p.rev, 0);

  return (
    <div className="border-t border-slate-800">
      {/* Header (クリックで開閉) */}
      <button
        onClick={() => setOpen(o => !o)}
        className="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-slate-800/40 transition-colors">
        <div className="flex items-center gap-2">
          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">売上計画</span>
          <span className="text-xs text-emerald-400 font-semibold">計{totalRev.toLocaleString()}万円</span>
        </div>
        <span className="text-slate-500 text-xs">{open ? '▲' : '▼'}</span>
      </button>

      {open && (
        <div className="px-4 pb-4 slide-in">
          <p className="text-xs text-slate-500 mb-3">発売後の月別売上計画（万円）。発売日変更時は自動スライドします。</p>
          <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
            {plan.sort((a,b)=>a.mo-b.mo).map(p => (
              <div key={p.mo} className="flex items-center gap-2">
                {/* 月ラベル */}

  );
}

// ─── FISCAL TAB（期次サマリー・全プロジェクト合算） ────────────────────────
function FiscalTab({projects}) {
  // 全プロジェクトを集計
  const allMap = useMemo(() => {
    const m = {};
    projects.forEach(p => {
      const pm = projectMonthlyAggregate(p);
      Object.entries(pm).forEach(([k, v]) => {
        if (!m[k]) m[k] = { planCost:0, fcstCost:0, planRev:0, fcstRev:0 };
        m[k].planCost += v.planCost;
        m[k].fcstCost += v.fcstCost;
        m[k].planRev  += v.planRev;
        m[k].fcstRev  += v.fcstRev;
      });
    });
    return m;
  }, [projects]);

  // 関連する全FYを抽出（データのある期 ± 余裕分を自動展開）
  const availableFYs = useMemo(() => {
    const set = new Set();
    Object.keys(allMap).forEach(k => {
      const [y, m] = k.split('-').map(Number);
      set.add(fiscalYearOfYM(y, m));
    });
    set.add(FY_BASE_YEAR); // 必ず144期は含める
    const min = Math.min(...set) - 1;
    const max = Math.max(...set) + 3; // データの最終期+3期まで自動で見れる
    const arr = [];
    for (let y = min; y <= max; y++) arr.push(y);
    return arr;
  }, [allMap]);

  const [fy, setFy] = useState(FY_BASE_YEAR);
  const [half, setHalf] = useState("full"); // "full" | "h1"(4-9月) | "h2"(10-3月)
  const halfLabel = half==="h1" ? "上期" : half==="h2" ? "下期" : "通期";

  const monthsAll = fiscalMonths(fy);
  const monthsFiltered = half==="h1" ? monthsAll.slice(0,6)
                       : half==="h2" ? monthsAll.slice(6,12)
                       : monthsAll;

  const rows = useMemo(() => monthsFiltered.map(({year, month}) => {
    const k = `${year}-${String(month).padStart(2,'0')}`;
    const v = allMap[k] || { planCost:0, fcstCost:0, planRev:0, fcstRev:0 };
    return {
      label: `${year}/${String(month).padStart(2,'0')}`,
      year, month,
      planCost: v.planCost, fcstCost: v.fcstCost,
      planRev: v.planRev,   fcstRev: v.fcstRev,
      costGap: v.fcstCost - v.planCost,
      revGap:  v.fcstRev  - v.planRev,
    };
  }), [allMap, fy, half]);

  const tot = rows.reduce((s, r) => ({
    planCost: s.planCost + r.planCost,
    fcstCost: s.fcstCost + r.fcstCost,
    planRev:  s.planRev  + r.planRev,
    fcstRev:  s.fcstRev  + r.fcstRev,
    costGap:  s.costGap  + r.costGap,
    revGap:   s.revGap   + r.revGap,
  }), {planCost:0,fcstCost:0,planRev:0,fcstRev:0,costGap:0,revGap:0});

  const costGapData = rows.map(r => ({label: `${r.month}月`, gap: r.costGap}));
  const revGapData  = rows.map(r => ({label: `${r.month}月`, gap: r.revGap}));
  const hasCostGap  = rows.some(r => r.costGap !== 0);
  const hasRevGap   = rows.some(r => r.revGap !== 0);

  return (
    <div className="space-y-5 slide-in">
      {/* 期セレクター */}
      <div className="flex items-center justify-between bg-slate-900 border border-slate-800 p-5">
        <div>
          <h2 className="text-lg font-bold text-white">期次サマリー（全プロジェクト合算）</h2>
          <p className="text-xs text-slate-400 mt-1">4月始まり・各月の計画 vs 予測の差異を集計</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap justify-end">
          <select value={fy} onChange={e=>setFy(Number(e.target.value))}
            className="bg-slate-800 border border-slate-600 px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            {availableFYs.map(y => (
              <option key={y} value={y}>第{fyToPeriod(y)}期（{y}年4月〜{y+1}年3月）</option>
            ))}
          </select>
          <div className="flex border border-slate-600 overflow-hidden">
            {[["full","通期"],["h1","上期"],["h2","下期"]].map(([k,l]) => (
              <button key={k} onClick={()=>setHalf(k)}
                className={`px-3 py-2 text-xs font-medium transition-colors ${half===k?"bg-indigo-600 text-white":"bg-slate-800 text-slate-400 hover:text-white"}`}>
                {l}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* KPI */}
      <div className="grid grid-cols-4 gap-4">
        <StatCard label={`${halfLabel}累計コスト（計画）`} value={`${tot.planCost.toLocaleString()}万円`} valueClass="text-slate-200"/>
        <StatCard label={`${halfLabel}累計コスト（予測）`} value={`${tot.fcstCost.toLocaleString()}万円`}
          valueClass={tot.costGap>0?"text-red-400":tot.costGap<0?"text-emerald-400":"text-slate-200"}
          sub={tot.costGap!==0?`差異 ${tot.costGap>0?"+":""}${tot.costGap.toLocaleString()}万円`:"差異なし"}/>
        <StatCard label={`${halfLabel}累計売上（計画）`} value={`${tot.planRev.toLocaleString()}万円`} valueClass="text-emerald-300"/>
        <StatCard label={`${halfLabel}累計売上（予測）`} value={`${tot.fcstRev.toLocaleString()}万円`}
          valueClass={tot.revGap<0?"text-red-400":tot.revGap>0?"text-emerald-400":"text-slate-200"}
          sub={tot.revGap!==0?`差異 ${tot.revGap>0?"+":""}${tot.revGap.toLocaleString()}万円`:"差異なし"}/>
      </div>

      {/* 月別コスト差異 */}
      <div className="bg-slate-900 border border-slate-800 p-6">
        <div className="flex items-center justify-between mb-2">
          <h3 className="text-sm font-semibold text-slate-300">月別コスト差異（予測 − 計画）</h3>
          <div className="flex items-center gap-3 text-xs text-slate-500">
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-red-500 inline-block"/>コスト増</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-emerald-500 inline-block"/>コスト減</span>
          </div>
        </div>
        {hasCostGap
          ? <GapBarChart data={costGapData} valueKey="gap" height={200}/>
          : <p className="text-xs text-slate-500 text-center py-12">この期の月別コスト差異はありません</p>}
      </div>

      {/* 月別売上差異 */}
      <div className="bg-slate-900 border border-slate-800 p-6">
        <div className="flex items-center justify-between mb-2">
          <h3 className="text-sm font-semibold text-slate-300">月別売上差異（予測 − 計画）</h3>
          <div className="flex items-center gap-3 text-xs text-slate-500">
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-red-500 inline-block"/>マイナス差異</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-emerald-500 inline-block"/>プラス差異</span>
          </div>
        </div>
        {hasRevGap
          ? <GapBarChart data={revGapData} valueKey="gap" height={200}/>
          : <p className="text-xs text-slate-500 text-center py-12">この期の月別売上差異はありません</p>}
      </div>

      {/* 詳細テーブル */}
      <div className="bg-slate-900 border border-slate-800 p-6">
        <h3 className="text-sm font-semibold text-slate-300 mb-3">月別詳細</h3>
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead className="bg-slate-800/60">
              <tr className="text-slate-400">
                <th className="px-3 py-2 text-left font-semibold">月</th>
                <th className="px-3 py-2 text-right font-semibold">計画コスト</th>
                <th className="px-3 py-2 text-right font-semibold">予測コスト</th>
                <th className="px-3 py-2 text-right font-semibold">コスト差異</th>
                <th className="px-3 py-2 text-right font-semibold">計画売上</th>
                <th className="px-3 py-2 text-right font-semibold">予測売上</th>
                <th className="px-3 py-2 text-right font-semibold">売上差異</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.label} className="border-t border-slate-800 hover:bg-slate-800/30">
                  <td className="px-3 py-2 text-slate-300 font-medium">{r.label}</td>
                  <td className="px-3 py-2 text-right text-slate-400">{r.planCost.toLocaleString()}</td>
                  <td className="px-3 py-2 text-right text-slate-300">{r.fcstCost.toLocaleString()}</td>
                  <td className={`px-3 py-2 text-right font-semibold ${r.costGap>0?"text-red-400":r.costGap<0?"text-emerald-400":"text-slate-600"}`}>
                    {r.costGap===0?"−":`${r.costGap>0?"+":""}${r.costGap.toLocaleString()}`}
                  </td>
                  <td className="px-3 py-2 text-right text-slate-400">{r.planRev.toLocaleString()}</td>
                  <td className="px-3 py-2 text-right text-slate-300">{r.fcstRev.toLocaleString()}</td>
                  <td className={`px-3 py-2 text-right font-semibold ${r.revGap<0?"text-red-400":r.revGap>0?"text-emerald-400":"text-slate-600"}`}>
                    {r.revGap===0?"−":`${r.revGap>0?"+":""}${r.revGap.toLocaleString()}`}
                  </td>
                </tr>
              ))}
              <tr className="border-t-2 border-slate-700 bg-slate-800/40 font-bold">
                <td className="px-3 py-2 text-white">{halfLabel}合計</td>
                <td className="px-3 py-2 text-right text-slate-200">{tot.planCost.toLocaleString()}</td>
                <td className="px-3 py-2 text-right text-slate-200">{tot.fcstCost.toLocaleString()}</td>
                <td className={`px-3 py-2 text-right ${tot.costGap>0?"text-red-400":tot.costGap<0?"text-emerald-400":"text-slate-600"}`}>
                  {tot.costGap===0?"−":`${tot.costGap>0?"+":""}${tot.costGap.toLocaleString()}`}
                </td>
                <td className="px-3 py-2 text-right text-slate-200">{tot.planRev.toLocaleString()}</td>
                <td className="px-3 py-2 text-right text-slate-200">{tot.fcstRev.toLocaleString()}</td>
                <td className={`px-3 py-2 text-right ${tot.revGap<0?"text-red-400":tot.revGap>0?"text-emerald-400":"text-slate-600"}`}>
                  {tot.revGap===0?"−":`${tot.revGap>0?"+":""}${tot.revGap.toLocaleString()}`}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p className="text-xs text-slate-500 mt-3">単位: 万円　／　全プロジェクトを合算</p>
      </div>
    </div>
  );
}

        <div className="mb-3 flex gap-2">
          <input className="flex-1 bg-slate-800 border border-slate-700 rounded-none px-2 py-1.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
            placeholder="プロジェクト名" value={newProjectName} onChange={e=>setNewProjectName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&addProject()} autoFocus/>
          <button onClick={addProject} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-none text-xs text-white font-semibold transition-colors">追加</button>
          <button onClick={()=>setShowNewProject(false)} className="px-2 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-none text-xs text-slate-300 transition-colors">✕</button>
        </div>
      )}

      {/* アクティブ（最大3件をクイック表示） */}
      <div className="space-y-1">
        {topActive.map(p => <ProjectRow key={p.id} p={p}/>)}
        {restActive.length>0 && (
          <div className="pt-1">
            <select value="" onChange={e=>e.target.value && setSelectedId(Number(e.target.value))}
              className="w-full bg-slate-800 border border-slate-700 px-2 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
              <option value="">▼ その他のアクティブ案件（{restActive.length}件）</option>

      {/* 完了案件（折りたたみ） */}
      {completed.length>0 && (
        <div className="mt-3 border-t border-slate-800 pt-2">
          <button onClick={()=>setShowCompleted(o=>!o)}
            className="w-full flex items-center justify-between text-[11px] text-emerald-400 hover:text-emerald-300 py-1">
            <span>✓ 完了案件 ({completed.length})</span>
            <span>{showCompleted?"▲":"▼"}</span>
          </button>
          {showCompleted && (
            <div className="space-y-1 mt-1">
              {completed.map(p => <ProjectRow key={p.id} p={p} dim/>)}
            </div>
          )}
        </div>
      )}

      {/* アーカイブ（さらに折りたたみ） */}
      {archived.length>0 && (
        <div className="mt-2 border-t border-slate-800 pt-2">
          <button onClick={()=>setShowArchived(o=>!o)}
            className="w-full flex items-center justify-between text-[11px] text-slate-500 hover:text-slate-300 py-1">
            <span>📦 アーカイブ ({archived.length})</span>
            <span>{showArchived?"▲":"▼"}</span>
          </button>
          {showArchived && (
            <div className="space-y-1 mt-1">
              {archived.map(p => <ProjectRow key={p.id} p={p} dim/>)}

      )}

      {projects.length===0 && (
        <p className="text-xs text-slate-500 text-center py-3">プロジェクトを追加してください</p>
      )}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [projects,setProjects]=useState(loadProjects);
  const [selectedId,setSelectedId]=useState(1);
  const [activeTab,setActiveTab]=useState(0);
  const [editingTask,setEditingTask]=useState(null);
  const [editingProject,setEditingProject]=useState(null);
  const [showNewProject,setShowNewProject]=useState(false);
  const [newProjectName,setNewProjectName]=useState("");

  useEffect(()=>{ saveProjects(projects); },[projects]);
  useEffect(()=>{ setEditingTask(null); },[selectedId]);

  const project=useMemo(()=>projects.find(p=>p.id===selectedId)||projects[0],[projects,selectedId]);

  const updateProject=useCallback((patch)=>{
    setProjects(prev=>prev.map(p=>p.id===project.id?{...p,...patch}:p));
  },[project]);

  const delayMonths=useMemo(()=>
    monthDiff(project.baselineLaunchYear,project.baselineLaunchMonth,
              project.forecastLaunchYear,project.forecastLaunchMonth),
  [project]);

  // タスクの予測オフセットを計算（個別設定 or グローバル連動）
  const getFcstOffsets = useCallback((task)=>{
    const isCustom = task.fcstStartOffset!==null && task.fcstStartOffset!==undefined;
    return {
      fcstStart: isCustom ? task.fcstStartOffset : task.startOffset + delayMonths,
      fcstEnd:   (task.fcstEndOffset!==null&&task.fcstEndOffset!==undefined)
                 ? task.fcstEndOffset : task.endOffset + delayMonths,
      isCustom,
    };
  },[delayMonths]);

  // タイムライン範囲
  const timelineMonths=useMemo(()=>{
    const minO=Math.min(...project.tasks.map(t=>t.startOffset))-1;
    const maxO=Math.max(...project.tasks.map(t=>{
      const {fcstEnd}=getFcstOffsets(t);
      return Math.max(t.endOffset,fcstEnd,12);
    }))+1;
    const arr=[];
    for(let o=minO;o<=maxO;o++){
      const b=addMonths(project.baselineLaunchYear,project.baselineLaunchMonth,o);
      arr.push({offset:o,...b,label:monthLabel(b.year,b.month)});
    }
    return arr;
  },[project,getFcstOffsets]);

  // コストデータ（計画・予測それぞれ独立計算）
  const costData=useMemo(()=>{
    const map={};
    timelineMonths.forEach(m=>{ map[m.offset]={label:m.label,baseline:0,forecast:0}; });
    project.tasks.forEach(task=>{
      const {fcstStart,fcstEnd}=getFcstOffsets(task);
      // 計画コスト
      const durB=task.endOffset-task.startOffset+1;
      const monthlyB=task.costType==="spread"?task.cost/durB:0;
      for(let o=task.startOffset;o<=task.endOffset;o++){
        const val=task.costType==="lump"?(o===task.endOffset?task.cost:0):monthlyB;
        if(map[o]) map[o].baseline+=val;
      }
      // 予測コスト
      const durF=fcstEnd-fcstStart+1;
      const monthlyF=task.costType==="spread"?task.cost/Math.max(1,durF):0;
      for(let o=fcstStart;o<=fcstEnd;o++){
        const val=task.costType==="lump"?(o===fcstEnd?task.cost:0):monthlyF;
        if(map[o]) map[o].forecast+=val;
      }
    });
    return timelineMonths.map(m=>({
      label:m.label, offset:m.offset,
      baseline:Math.round(map[m.offset]?.baseline||0),
      forecast:Math.round(map[m.offset]?.forecast||0),
    }));
  },[project,timelineMonths,getFcstOffsets]);

  // 売上データ
  const salesData=useMemo(()=>{
    const sm={};
    project.salesPlan.forEach(s=>{sm[s.mo]=s.rev;});
    let cumBase=0,cumFcst=0;
    return timelineMonths.map(m=>{
      const br=m.offset>=1?(sm[m.offset]||0):0;
      const fr=(m.offset-delayMonths)>=1?(sm[m.offset-delayMonths]||0):0;
      cumBase+=br; cumFcst+=fr;
      return {label:m.label,offset:m.offset,baseRev:br,fcstRev:fr,loss:br-fr,
              cumBase,cumForecast:cumFcst,cumLoss:cumBase-cumFcst};
    });
  },[project,timelineMonths,delayMonths]);

  const totalLoss=useMemo(()=>{
    const now={year:new Date().getFullYear(),month:new Date().getMonth()+1};
    const todayOff=monthDiff(project.baselineLaunchYear,project.baselineLaunchMonth,now.year,now.month);
    const row=salesData.find(d=>d.offset===todayOff)||salesData[salesData.length-1];
    return row?.cumLoss||0;
  },[salesData,project]);

  // プロジェクト追加
  function addProject(){
    if(!newProjectName.trim()) return;
    const id=Math.max(...projects.map(p=>p.id))+1;
    setProjects(prev=>[...prev,{
      id, name:newProjectName.trim(),
      baselineLaunchYear:2027,baselineLaunchMonth:4,
      forecastLaunchYear:2027,forecastLaunchMonth:4,
      tasks:[
        {id:1,name:"企画・調査",startOffset:-6,endOffset:-4,cost:50, costType:"lump",color:"#6366f1",fcstStartOffset:null,fcstEndOffset:null},
        {id:2,name:"開発・製造",startOffset:-4,endOffset:-1,cost:200,costType:"lump",color:"#f59e0b",fcstStartOffset:null,fcstEndOffset:null},
        {id:3,name:"販促",     startOffset:-1,endOffset:2, cost:80, costType:"lump",color:"#10b981",fcstStartOffset:null,fcstEndOffset:null},
      ],
      salesPlan:Array.from({length:12},(_,i)=>({mo:i+1,rev:0})),
    }]);
    setSelectedId(id);
    setShowNewProject(false);
    setNewProjectName("");
  }

  function deleteProject(id){
    setProjects(prev=>{
      const next = prev.filter(p=>p.id!==id);
      if(selectedId===id) setSelectedId(next[0]?.id);
      return next;
    });
  }

  function saveProjectEdit(id, patch){
    setProjects(prev=>prev.map(p=>p.id===id?{...p,...patch}:p));
  }

  // ── データ入出力 ─────────────────────────────────────
  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function ts() {
    const d = new Date();
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  }
  function csvEscape(v) {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  function toCSV(headers, rows) {
    const BOM = "﻿"; // Excelで文字化けしないように
    return BOM + [headers, ...rows].map(r => r.map(csvEscape).join(",")).join("\r\n");
  }

  function exportJSON() {
    downloadFile(`pdp_backup_${ts()}.json`,
      JSON.stringify({version:1, exportedAt:new Date().toISOString(), projects}, null, 2),
      "application/json");
  }
  function importJSON(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const arr = Array.isArray(data) ? data : data.projects;
        if (!Array.isArray(arr)) throw new Error("形式エラー");
        if (confirm(`${arr.length}件のプロジェクトをインポートします。\n現在のデータは上書きされます。よろしいですか？`)) {
          setProjects(normalizeProjects(arr));
          setSelectedId(arr[0]?.id);
          alert("インポート完了");
        }
      } catch (err) {
        alert("インポート失敗: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }
  function exportProjectsCSV() {
    const headers = ["プロジェクト名","ステータス","計画発売日","予測発売日","遅延月数","タスク数","平均進捗率","総コスト(万円)","売上計画(万円)"];
    const rows = projects.map(p => {
      const delay = monthDiff(p.baselineLaunchYear,p.baselineLaunchMonth,p.forecastLaunchYear,p.forecastLaunchMonth);
      const totalCost = p.tasks.reduce((s,t)=>s+(t.cost||0),0);
      const totalRev  = p.salesPlan.reduce((s,r)=>s+(r.rev||0),0);
      const avgProgress = p.tasks.length>0 ? Math.round(p.tasks.reduce((s,t)=>s+(t.progress||0),0)/p.tasks.length) : 0;
      return [
        p.name,
        (PROJECT_STATUS[p.status||"active"]?.label) || "アクティブ",
        `${p.baselineLaunchYear}/${String(p.baselineLaunchMonth).padStart(2,'0')}`,
        `${p.forecastLaunchYear}/${String(p.forecastLaunchMonth).padStart(2,'0')}`,
        delay, p.tasks.length, `${avgProgress}%`, totalCost, totalRev,
      ];
    });
    downloadFile(`pdp_projects_${ts()}.csv`, toCSV(headers, rows), "text/csv;charset=utf-8");
  }
  function exportTasksCSV() {
    const headers = ["プロジェクト名","タスク名","計画開始","計画終了","予測開始","予測終了","コスト(万円)","進捗率","ステータス","個別設定"];
    const rows = [];
    projects.forEach(p => {
      const delay = monthDiff(p.baselineLaunchYear,p.baselineLaunchMonth,p.forecastLaunchYear,p.forecastLaunchMonth);
      p.tasks.forEach(t => {
        const ps = offsetToYM(p.baselineLaunchYear,p.baselineLaunchMonth,t.startOffset);
        const pe = offsetToYM(p.baselineLaunchYear,p.baselineLaunchMonth,t.endOffset);
        const isCustom = t.fcstStartOffset !== null && t.fcstStartOffset !== undefined;
        const fs = offsetToYM(p.baselineLaunchYear,p.baselineLaunchMonth, isCustom?t.fcstStartOffset:t.startOffset+delay);
        const fe = offsetToYM(p.baselineLaunchYear,p.baselineLaunchMonth, (t.fcstEndOffset!=null)?t.fcstEndOffset:t.endOffset+delay);
        rows.push([
          p.name, t.name,
          `${ps.year}/${String(ps.month).padStart(2,'0')}`,
          `${pe.year}/${String(pe.month).padStart(2,'0')}`,
          `${fs.year}/${String(fs.month).padStart(2,'0')}`,
          `${fe.year}/${String(fe.month).padStart(2,'0')}`,
          t.cost||0, `${t.progress||0}%`,
          STATUS_DEF[t.status||"not_started"].label,
          isCustom ? "はい" : "いいえ",
        ]);
      });
    });
    downloadFile(`pdp_tasks_${ts()}.csv`, toCSV(headers, rows), "text/csv;charset=utf-8");
  }
  function exportFiscalCSV() {
    // 全プロジェクト合算の月別集計を、データのある期間すべてで出力
    const allMap = {};
    projects.forEach(p => {
      const pm = projectMonthlyAggregate(p);
      Object.entries(pm).forEach(([k,v]) => {
        if (!allMap[k]) allMap[k] = {planCost:0,fcstCost:0,planRev:0,fcstRev:0};
        allMap[k].planCost += v.planCost; allMap[k].fcstCost += v.fcstCost;
        allMap[k].planRev  += v.planRev;  allMap[k].fcstRev  += v.fcstRev;
      });
    });
    const keys = Object.keys(allMap).sort();
    const headers = ["年月","期","計画コスト(万円)","予測コスト(万円)","コスト差異","計画売上(万円)","予測売上(万円)","売上差異"];
    const rows = keys.map(k => {
      const [y,m] = k.split('-').map(Number);
      const v = allMap[k];
      return [
        `${y}/${String(m).padStart(2,'0')}`,
        `第${fyToPeriod(fiscalYearOfYM(y,m))}期`,
        v.planCost, v.fcstCost, v.fcstCost - v.planCost,
        v.planRev,  v.fcstRev,  v.fcstRev  - v.planRev,
      ];
    });
    downloadFile(`pdp_fiscal_${ts()}.csv`, toCSV(headers, rows), "text/csv;charset=utf-8");
  }
  const [showDataMenu, setShowDataMenu] = useState(false);

  function saveTask(f){
    const tasks=editingTask.id==="new"
      ?[...project.tasks,{...f,id:Date.now(),color:`hsl(${Math.random()*360},70%,55%)`}]
      :project.tasks.map(t=>t.id===editingTask.id?{...t,...f}:t);
    updateProject({tasks});
    setEditingTask(null);
  }

  const TABS=["進捗タイムライン","月別コスト推移","売上・インパクト分析","期次サマリー","全プロジェクト一覧"];

  return(
    <div className="min-h-screen bg-slate-950 flex flex-col">
      {editingProject && (
        <ProjectEditModal
          project={editingProject}
          onClose={()=>setEditingProject(null)}
          onSave={(patch)=>saveProjectEdit(editingProject.id, patch)}
          onDelete={()=>deleteProject(editingProject.id)}
        />
      )}
      {/* Header */}
      <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center gap-4">
        <div className="w-8 h-8 rounded-none bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
          <IcoTrend s={16} c="text-white"/>
        </div>
        <div>
          <h1 className="text-lg font-bold text-white leading-tight">新商品開発プロセス進捗シミュレーター</h1>
          <p className="text-xs text-slate-400">発売日変更が財務インパクトに与える影響をリアルタイム分析</p>
        </div>
        {delayMonths!==0&&(
          <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border ${delayMonths>0?"bg-red-950 text-red-400 border-red-800":"bg-emerald-950 text-emerald-400 border-emerald-800"}`}>
            <IcoAlert s={12}/>
            {delayMonths>0?`${delayMonths}ヶ月遅延中`:`${Math.abs(delayMonths)}ヶ月前倒し`}
          </div>
        )}
        <div className="ml-auto relative">
          <button onClick={()=>setShowDataMenu(o=>!o)}
            className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 font-semibold transition-colors">
            📁 データ ▼
          </button>
          {showDataMenu && (
            <>
              <div className="fixed inset-0 z-30" onClick={()=>setShowDataMenu(false)}/>
              <div className="absolute right-0 top-full mt-1 bg-slate-900 border border-slate-700 z-40 w-56 shadow-xl">
                <div className="px-3 py-2 text-[10px] text-slate-500 uppercase tracking-wider border-b border-slate-800">バックアップ</div>
                <button onClick={()=>{exportJSON(); setShowDataMenu(false);}}
                  className="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-slate-800">📦 JSONエクスポート（全データ）</button>
                <label className="w-full block text-left px-3 py-2 text-xs text-slate-200 hover:bg-slate-800 cursor-pointer">
                  📥 JSONインポート
                  <input type="file" accept=".json,application/json" className="hidden"
                    onChange={e=>{importJSON(e); setShowDataMenu(false);}}/>
                </label>
                <div className="px-3 py-2 text-[10px] text-slate-500 uppercase tracking-wider border-b border-t border-slate-800">CSV（Excel用）</div>
                <button onClick={()=>{exportProjectsCSV(); setShowDataMenu(false);}}
                  className="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-slate-800">📊 プロジェクト一覧</button>
                <button onClick={()=>{exportTasksCSV(); setShowDataMenu(false);}}
                  className="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-slate-800">📊 タスク詳細</button>
                <button onClick={()=>{exportFiscalCSV(); setShowDataMenu(false);}}
                  className="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-slate-800">📊 月別集計（全プロジェクト合算）</button>
              </div>
            </>
          )}
        </div>
      </header>

      <div className="flex flex-1 overflow-hidden">
        {/* LEFT */}
        <aside className="w-80 min-w-[300px] bg-slate-900 border-r border-slate-800 flex flex-col overflow-y-auto">
          {/* Project selector */}
          <ProjectListPanel
            projects={projects}
            selectedId={selectedId}
            setSelectedId={setSelectedId}
            setEditingProject={setEditingProject}
            showNewProject={showNewProject}
            setShowNewProject={setShowNewProject}
            newProjectName={newProjectName}
            setNewProjectName={setNewProjectName}
            addProject={addProject}
          />

          {/* Tasks */}
          <div className="p-4 flex-1">
            <div className="flex items-center justify-between mb-3">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">開発タスク</span>
              <button onClick={()=>setEditingTask({id:"new",name:"",startOffset:-6,endOffset:-1,cost:0,costType:"lump",fcstStartOffset:null,fcstEndOffset:null})}
                className="text-indigo-400 hover:text-indigo-300"><IcoPlus s={16}/></button>
            </div>
            {editingTask&&<TaskForm task={editingTask}
              baselineLaunchYear={project.baselineLaunchYear}
              baselineLaunchMonth={project.baselineLaunchMonth}
              delayMonths={delayMonths} onSave={saveTask} onCancel={()=>setEditingTask(null)}/>}
            <div className="space-y-2">
              {project.tasks.map(task=>{
                const {fcstStart,fcstEnd,isCustom}=getFcstOffsets(task);
                const planS=offsetToYM(project.baselineLaunchYear,project.baselineLaunchMonth,task.startOffset);
                const planE=offsetToYM(project.baselineLaunchYear,project.baselineLaunchMonth,task.endOffset);
                const fcstS=offsetToYM(project.baselineLaunchYear,project.baselineLaunchMonth,fcstStart);
                const fcstE=offsetToYM(project.baselineLaunchYear,project.baselineLaunchMonth,fcstEnd);
                return(
                  <div key={task.id} className={`p-3 border ${isCustom?"bg-amber-950/20 border-amber-700/50":"bg-slate-800 border-slate-700"}`}>
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex items-center gap-2 min-w-0">
                        <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{background:task.color}}/>
                        <span className="text-sm text-white font-medium truncate">{task.name}</span>
                        {isCustom&&<IcoPin s={10} c="text-amber-400 shrink-0"/>}
                      </div>
                      <div className="flex gap-1 shrink-0">
                        <button onClick={()=>setEditingTask({...task})} className="text-slate-500 hover:text-indigo-400 transition-colors"><IcoEdit s={13}/></button>
                        <button onClick={()=>updateProject({tasks:project.tasks.filter(t=>t.id!==task.id)})} className="text-slate-500 hover:text-red-400 transition-colors"><IcoTrash s={13}/></button>
                      </div>
                    </div>
                    <div className="mt-1.5 text-xs text-slate-400">
                      計画: {planS.year}/{String(planS.month).padStart(2,'0')} 〜 {planE.year}/{String(planE.month).padStart(2,'0')}
                      {task.cost>0&&<span className="ml-2 text-amber-400 font-semibold">¥{task.cost.toLocaleString()}万</span>}
                    </div>
                    <div className="mt-1.5 flex items-center gap-2">
                      <span className={`text-[10px] font-semibold px-1.5 py-0.5 ${STATUS_DEF[task.status||"not_started"].bg} ${STATUS_DEF[task.status||"not_started"].text}`}>
                        {STATUS_DEF[task.status||"not_started"].label}
                      </span>
                      <div className="flex-1 h-1.5 bg-slate-700 overflow-hidden">
                        <div className="h-full bg-emerald-500 transition-all" style={{width:`${task.progress||0}%`}}/>
                      </div>
                      <span className="text-[10px] text-emerald-400 font-semibold">{task.progress||0}%</span>
                    </div>
                    {(isCustom||(delayMonths!==0&&!isCustom))&&(
                      <div className={`mt-0.5 text-xs ${isCustom?"text-amber-400/80":"text-indigo-400/70"}`}>
                        予測: {fcstS.year}/{String(fcstS.month).padStart(2,'0')} 〜 {fcstE.year}/{String(fcstE.month).padStart(2,'0')}
                        {isCustom&&<span className="ml-1 text-amber-500">📌</span>}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="mt-4 grid grid-cols-2 gap-2">
              <MiniStat label="総開発コスト" value={`${project.tasks.reduce((s,t)=>s+t.cost,0).toLocaleString()}万円`}/>
              <MiniStat label="機会損失（累計）" value={totalLoss>0?`-${totalLoss.toLocaleString()}万円`:"なし"} valueClass={totalLoss>0?"text-red-400":"text-emerald-400"}/>
            </div>
          </div>

          {/* 売上計画エディター */}
          <SalesPlanEditor project={project} updateProject={updateProject}/>
        </aside>

        {/* RIGHT */}
        <main className="flex-1 flex flex-col overflow-hidden">
          <div className="bg-slate-900 border-b border-slate-800 px-6 flex gap-1 pt-2">
            {TABS.map((tab,i)=>(
              <button key={i} onClick={()=>setActiveTab(i)}
                className={`px-4 py-2.5 text-sm font-medium rounded-none transition-colors ${activeTab===i?"bg-slate-950 text-indigo-400 border-x border-t border-slate-700":"text-slate-400 hover:text-slate-200"}`}>
                {tab}
              </button>
            ))}
          </div>
          <div className="flex-1 overflow-auto p-6 bg-slate-950">
            {activeTab===0&&<GanttTab project={project} delayMonths={delayMonths} timelineMonths={timelineMonths} getFcstOffsets={getFcstOffsets} updateProject={updateProject}/>}
            {activeTab===1&&<CostTab costData={costData} delayMonths={delayMonths}/>}
            {activeTab===2&&<SalesTab salesData={salesData} totalLoss={totalLoss} delayMonths={delayMonths} project={project}/>}
            {activeTab===3&&<FiscalTab projects={projects}/>}
            {activeTab===4&&<OverviewTab projects={projects} setSelectedId={setSelectedId} setActiveTab={setActiveTab}/>}
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
